<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dhanmondi Transport Community | Daffodil International University</title>
    <meta name="description" content="University bus schedules, routes and transport notices for the DIU community.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #4F98CA;
            --green: #50D890;
            --mint: #EFFFFB;
            --bg: #EFFFFB;
            --surface: #fff;
            --ink: #12303f;
            --muted: #4a6472;
            --line: #cfe6e6;
            --link: #1d5f93;
            --on-blue: #0b2638;
            --logo-bg: #fff;
            --shadow: 0 6px 24px rgba(31, 95, 147, .12);
            --frame: #4F98CA;
            --frame-ink: #0b2638;
            --hh: 68px
        }

        [data-theme=dark] {
            --bg: #0e1a22;
            --surface: #16262f;
            --ink: #e6f4f4;
            --muted: #9bb5bf;
            --line: #26414d;
            --link: #7dbbe6;
            --logo-bg: #fff;
            --shadow: 0 6px 24px rgba(0, 0, 0, .4);
            --frame: #10212b;
            --frame-ink: #e6f4f4
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px
        }

        body {
            font-family: "Hind Siliguri", system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            font-size: 1rem;
            transition: background .3s, color .3s;
            overflow-x: hidden
        }

        h1,
        h2,
        h3 {
            font-family: Sora, "Hind Siliguri", sans-serif;
            line-height: 1.2
        }

        a {
            color: var(--link)
        }

        :focus-visible {
            outline: 3px solid var(--green);
            outline-offset: 2px
        }

        .wrap {
            width: min(1120px, 100% - 2rem);
            margin-inline: auto
        }

        section {
            padding: 3.5rem 0
        }

        h2 {
            font-size: clamp(1.5rem, 5vw, 2.1rem);
            margin-bottom: .4rem
        }

        .lead {
            color: var(--muted);
            margin-bottom: 1.5rem;
            max-width: 60ch
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            min-height: 46px;
            padding: .6rem 1.1rem;
            border-radius: 999px;
            border: 2px solid var(--blue);
            background: var(--blue);
            color: var(--on-blue);
            font: 600 1rem inherit;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: transform .15s, background .2s
        }

        .btn:hover {
            transform: translateY(-2px)
        }

        .btn.g {
            background: var(--green);
            border-color: var(--green)
        }

        .btn.o {
            background: transparent;
            color: var(--ink)
        }

        /* nav */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--frame);
            color: var(--frame-ink);
            transition: background .3s
        }

        [data-theme=dark] header {
            border-bottom: 1px solid var(--line)
        }

        .nav {
            display: flex;
            align-items: center;
            gap: .75rem;
            min-height: var(--hh);
            padding-inline: clamp(12px, 3.2vw, 44px)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .7rem;
            text-decoration: none;
            color: inherit;
            margin-right: auto;
            min-width: 0
        }

        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--logo-bg);
            flex: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .7)
        }

        .brand b {
            font: 700 1rem/1.15 Sora, sans-serif;
            display: block;
            white-space: nowrap
        }

        .brand small {
            font-size: .74rem;
            opacity: .85;
            display: block;
            white-space: nowrap
        }

        .actions {
            display: flex;
            gap: .5rem;
            align-items: center
        }

        .links {
            display: none;
            list-style: none;
            padding: 0;
            margin: 0
        }

        .links a {
            display: block;
            padding: .5rem .85rem;
            border-radius: 999px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 500;
            white-space: nowrap;
            transition: background .2s, color .2s
        }

        .links a:hover {
            background: var(--line)
        }

        .links a.on {
            background: var(--green);
            color: #0b2638;
            font-weight: 700
        }

        .ic {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            font: 600 .9rem inherit;
            font-family: inherit;
            transition: border-color .2s, transform .2s
        }

        .ic:hover {
            border-color: var(--green);
            transform: translateY(-1px)
        }

        #menu {
            display: grid;
            place-items: center
        }

        .links.open {
            display: flex;
            flex-direction: column;
            gap: .2rem;
            position: absolute;
            left: 12px;
            right: 12px;
            top: calc(100% + 6px);
            background: var(--surface);
            padding: .6rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 2px solid var(--line)
        }

        .links.open a {
            border-radius: 12px;
            padding: .75rem 1rem
        }

        @media(max-width:520px) {
            .brand b {
                white-space: normal;
                font-size: .82rem
            }

            .brand small {
                display: none
            }

            .brand img,
            .ic {
                width: 40px;
                height: 40px
            }

            .actions {
                gap: .35rem
            }
        }

        @media(min-width:1440px) {
            .nav {
                display: grid;
                grid-template-columns: 1fr auto 1fr
            }

            .actions {
                justify-self: end
            }

            .links {
                display: flex;
                gap: .15rem;
                background: var(--surface);
                padding: .3rem;
                border-radius: 999px;
                box-shadow: var(--shadow)
            }

            #menu {
                display: none
            }
        }

        /* longer menu: compact layout on mid-size desktops, hamburger below 1440px */
        @media(min-width:1440px) and (max-width:1719px) {
            .nav {
                grid-template-columns: auto 1fr auto
            }

            .links {
                justify-self: center
            }

            .links a {
                padding: .5rem .6rem
            }
        }

        /* hero */
        .hero {
            --nh: clamp(64px, 9vw, 92px);
            --nw: clamp(150px, 26vw, 260px);
            padding: 0;
            background: var(--frame);
            min-height: calc(100vh - var(--hh));
            min-height: calc(100svh - var(--hh));
            display: flex
        }

        .frame {
            flex: 1;
            display: flex;
            width: 100%;
            padding: 0 clamp(12px, 3.2vw, 44px) clamp(12px, 3.2vw, 44px)
        }

        .shot {
            position: relative;
            flex: 1;
            min-height: 480px;
            border-radius: 26px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            background: #12303f;
            isolation: isolate
        }

        .shot .bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2
        }

        .shot .scrim {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(90deg, rgba(6, 24, 36, .84), rgba(6, 24, 36, .45) 58%, rgba(6, 24, 36, .08)), linear-gradient(0deg, rgba(6, 24, 36, .5), transparent 40%)
        }

        .hc {
            padding: clamp(1.2rem, 4vw, 3.5rem);
            padding-bottom: calc(var(--nh) + 1.4rem);
            max-width: 760px;
            color: #fff
        }

        .hc h3 {
            color: var(--green);
            font-size: 1.1rem;
            font-weight: 700
        }

        .hc h1 {
            font-size: clamp(2.2rem, 8vw, 4.6rem);
            font-weight: 800;
            letter-spacing: -.02em;
            margin: .5rem 0
        }

        .hc p {
            color: rgba(255, 255, 255, .92);
            max-width: 52ch;
            margin: .8rem 0 1.4rem
        }

        .hc .btn.o {
            color: #fff;
            border-color: #fff
        }

        .notch {
            position: absolute;
            background: var(--frame);
            color: var(--frame-ink);
            display: flex;
            height: var(--nh);
            padding: .4rem 1.1rem
        }

        .notch.tr {
            top: 0;
            right: 0;
            min-width: var(--nw);
            border-bottom-left-radius: 26px;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center
        }

        .notch.bl {
            bottom: 0;
            left: 0;
            align-items: center;
            gap: .7rem;
            padding-right: 1.5rem;
            border-top-right-radius: 26px;
            font-weight: 700;
            font-size: .85rem;
            line-height: 1.2
        }

        .notch.bl img {
            height: calc(var(--nh) - 22px);
            width: auto;
            border-radius: 10px;
            background: #fff;
            padding: 2px
        }

        .clock {
            font: 800 clamp(1.2rem, 3.8vw, 1.9rem)/1 Sora, sans-serif;
            font-variant-numeric: tabular-nums
        }

        .clock-d {
            font-size: .78rem;
            font-weight: 600;
            margin-top: .2rem
        }

        h2:after {
            content: "";
            display: block;
            width: 56px;
            height: 6px;
            border-radius: 3px;
            background: var(--green);
            margin-top: .5rem
        }

        .card {
            border-radius: 22px;
            border: 2px solid var(--line)
        }

        .links.open a {
            color: var(--ink)
        }

        footer .meta {
            color: inherit
        }

        /* quick cards */
        .qgrid,
        .grid {
            display: grid;
            gap: 1rem
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 1.1rem;
            box-shadow: var(--shadow)
        }

        @media(min-width:640px) {
            .grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(min-width:960px) {
            .grid.three {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        /* filters */
        .tools {
            display: grid;
            gap: .6rem;
            margin-bottom: 1.2rem
        }

        .tools input,
        .tools select {
            width: 100%;
            min-height: 46px;
            padding: .5rem .9rem;
            border-radius: 12px;
            border: 2px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font: inherit
        }

        @media(min-width:700px) {
            .tools {
                grid-template-columns: 2fr 1fr 1fr
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 1.2rem
        }

        .chip {
            min-height: 40px;
            padding: .3rem .9rem;
            border-radius: 999px;
            border: 2px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font: 500 .92rem inherit;
            font-family: inherit;
            cursor: pointer
        }

        .chip[aria-pressed=true] {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--on-blue);
            font-weight: 700
        }

        .sample {
            display: inline-block;
            background: rgba(80, 216, 144, .25);
            border: 1px dashed var(--green);
            border-radius: 8px;
            padding: .15rem .6rem;
            font-size: .82rem;
            margin-bottom: 1rem
        }

        .empty {
            padding: 1.5rem;
            text-align: center;
            color: var(--muted);
            border: 2px dashed var(--line);
            border-radius: 16px;
            grid-column: 1/-1
        }

        /* schedule */
        .nextbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .3rem 1rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1.2rem;
            border-radius: 20px;
            background: var(--frame);
            color: var(--frame-ink);
            border-left: 8px solid var(--green)
        }

        .nextbar b {
            font: 800 1.4rem Sora, sans-serif;
            font-variant-numeric: tabular-nums
        }

        .nextbar .lb {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            opacity: .85
        }

        .nextbar .cd {
            margin-left: auto;
            background: var(--green);
            color: #0b2638;
            font-weight: 700;
            padding: .2rem .85rem;
            border-radius: 999px
        }

        .slist {
            display: grid;
            gap: .75rem
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .sch {
            background: var(--surface);
            border: 2px solid var(--line);
            border-radius: 20px;
            overflow: hidden;
            opacity: 0;
            animation: rise .5s cubic-bezier(.2, .7, .2, 1) forwards;
            animation-delay: calc(var(--i)*55ms);
            transition: border-color .25s, box-shadow .25s
        }

        .sch:hover,
        .sch.open {
            border-color: var(--blue);
            box-shadow: var(--shadow)
        }

        .sch.isnext {
            border-color: var(--green)
        }

        .sh {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: .9rem 1rem;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer
        }

        .tb {
            display: grid;
            place-items: center;
            min-width: 84px;
            padding: .55rem .6rem;
            border-radius: 14px;
            background: var(--bg);
            border: 2px solid var(--line);
            transition: background .3s, border-color .3s, color .3s
        }

        .tb b {
            font: 800 1.5rem/1 Sora, sans-serif;
            font-variant-numeric: tabular-nums
        }

        .tb i {
            font-style: normal;
            font-size: .72rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: .06em;
            margin-top: .2rem
        }

        .sch:hover .tb,
        .sch.open .tb {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--on-blue)
        }

        .sch.isnext .tb {
            background: var(--green);
            border-color: var(--green);
            color: #0b2638
        }

        .sch:hover .tb i,
        .sch.open .tb i,
        .sch.isnext .tb i {
            color: inherit
        }

        .mid strong {
            display: block;
            font-size: 1.02rem
        }

        .mid small {
            color: var(--muted)
        }

        .nx {
            display: none;
            margin-left: .5rem;
            padding: .05rem .6rem;
            border-radius: 999px;
            background: var(--green);
            color: #0b2638;
            font-size: .72rem;
            font-weight: 700;
            vertical-align: middle
        }

        .isnext .nx {
            display: inline-block
        }

        .chev {
            width: 10px;
            height: 10px;
            border: solid var(--muted);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            transition: transform .35s;
            margin-right: .3rem
        }

        .sch.open .chev {
            transform: rotate(-135deg) translate(-2px, -2px)
        }

        .sb {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .4s cubic-bezier(.4, 0, .2, 1)
        }

        .sch.open .sb {
            grid-template-rows: 1fr
        }

        .sb>div {
            overflow: hidden;
            min-height: 0
        }

        .sbi {
            padding: .2rem 1rem 1.1rem;
            border-top: 1px solid var(--line);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .3s .1s, transform .3s .1s
        }

        .sch.open .sbi {
            opacity: 1;
            transform: none
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: .8rem;
            margin: 1rem 0
        }

        .facts span {
            display: block;
            font-size: .74rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .facts b {
            font-weight: 600
        }

        .path {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: .45rem .1rem
        }

        .path li {
            display: flex;
            align-items: center
        }

        .path li:not(:last-child):after {
            content: "›";
            color: var(--blue);
            font-weight: 700;
            margin: 0 .3rem
        }

        .path .p {
            font-size: .9rem;
            padding: .2rem .75rem;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid var(--line)
        }

        .path li:first-child .p {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--on-blue)
        }

        .path li:last-child .p {
            background: var(--green);
            border-color: var(--green);
            color: #0b2638
        }

        @media(max-width:480px) {
            .tb {
                min-width: 70px
            }

            .tb b {
                font-size: 1.3rem
            }
        }

        /* exam timings */
        .exg {
            display: grid;
            gap: 1rem
        }

        @media(min-width:760px) {
            .exg {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        .exc {
            padding: 0;
            overflow: hidden;
            transition: transform .2s, border-color .2s
        }

        .exc:hover {
            transform: translateY(-3px);
            border-color: var(--blue)
        }

        .exc.fin:hover {
            border-color: var(--green)
        }

        .exh {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: .5rem;
            padding: 1rem 1.2rem;
            background: var(--blue);
            color: var(--on-blue)
        }

        .exc.fin .exh {
            background: var(--green)
        }

        .exh h3 {
            font-size: 1.3rem
        }

        .exh .tag {
            background: rgba(255, 255, 255, .55);
            color: #0b2638;
            margin: 0
        }

        .exs {
            list-style: none;
            padding: 1rem 1.2rem 1.2rem;
            margin: 0;
            display: grid;
            gap: .7rem
        }

        .exs li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: .3rem 1rem;
            padding: .75rem 1rem;
            border-radius: 14px;
            background: var(--bg);
            border: 2px solid var(--line)
        }

        .exs li span {
            color: var(--ink);
            font-weight: 600;
            font-size: 1rem
        }

        .exs li.out {
            border-left: 6px solid var(--blue)
        }

        .exs li.ret {
            border-left: 6px solid var(--green)
        }

        .exs li b {
            font: 800 1.2rem Sora, "Hind Siliguri", sans-serif;
            font-variant-numeric: tabular-nums
        }

        .gal {
            display: grid;
            gap: 1.1rem;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            margin-top: 1.4rem
        }

        .gal>* {
            aspect-ratio: 4/3;
            border: 0;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            padding: 0;
            background: linear-gradient(135deg, var(--blue), var(--green));
            box-shadow: var(--shadow);
            animation: rise .6s cubic-bezier(.2, .7, .2, 1) both;
            animation-delay: calc(var(--i, 0)*90ms);
            transition: transform .35s cubic-bezier(.2, .7, .2, 1), box-shadow .35s
        }

        .gal button {
            cursor: pointer;
            display: block;
            width: 100%;
            outline-offset: 3px
        }

        .gal button:hover,
        .gal button:focus-visible {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(31, 95, 147, .3)
        }

        .gal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .6s cubic-bezier(.2, .7, .2, 1)
        }

        .gal button:hover img,
        .gal button:focus-visible img {
            transform: scale(1.08)
        }

        .gal button:before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(180deg, rgba(6, 24, 36, 0) 45%, rgba(6, 24, 36, .82));
            pointer-events: none
        }

        .gal button:after {
            content: "⤢";
            position: absolute;
            z-index: 2;
            top: .8rem;
            right: .8rem;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, .92);
            color: #0b2638;
            font-size: 1.15rem;
            font-weight: 700;
            opacity: 0;
            transform: scale(.7);
            transition: opacity .25s, transform .25s
        }

        .gal button:hover:after,
        .gal button:focus-visible:after {
            opacity: 1;
            transform: none
        }

        .gal .ph {
            display: grid;
            place-items: center;
            color: var(--on-blue);
            font-weight: 600;
            font-style: normal;
            opacity: .75
        }

        .gal figcaption {
            position: absolute;
            z-index: 2;
            inset: auto 0 0;
            padding: 1.4rem 1.1rem 1rem;
            color: #fff;
            font: 700 1.02rem/1.3 Sora, "Hind Siliguri", sans-serif;
            text-align: left;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .45);

        }

        .gmg {

        }

        .meta {

            bottom: -.3rem;

        .stops li:last-child:after {
            display: none
        }

        .stops li:last-child:before {

        }

            z-index: -1;
            border-radius: 50%;

            height: 220px;

            height: 130px;

            background: var(--blue);

            color: var(--on-blue);
            font-weight: 700
        }

            display: flex;
            justify-content: flex-end;

            width: 100%;
            justify-content: center;
            min-height: 54px;
            font-size: 1.05rem
        }

            width: 20px;
            height: 20px;
            transition: transform .25s
        }

        .cbsend:hover svg {
            transform: translate(3px, -3px)
        }

        .cbsend:disabled {
            opacity: .6;
            cursor: wait;
            transform: none
        }

        .cbst {
            border-radius: 14px;
            font-weight: 600
        }

        .cbst:not(:empty) {
            padding: .75rem 1rem;
            border: 2px solid var(--blue);
            background: rgba(79, 152, 202, .15)
        }

        .cbst.ok {
            border-color: var(--green);
            background: rgba(80, 216, 144, .22)
        }

        .cbst.err {
            border-color: #e05a5a;
            background: rgba(224, 90, 90, .14)
        }

        .hp {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0
        }

        /* contact cards, social links, whatsapp button */
        .cc {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: transform .25s, border-color .25s, box-shadow .25s
        }

        .cc:hover {
            transform: translateY(-4px);
            border-color: var(--green);
            box-shadow: 0 14px 30px rgba(31, 95, 147, .2)
        }

        .cci {
            flex: none;
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            border-radius: 17px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            color: #0b2638
        }

        .cci svg {
            width: 26px;
            height: 26px
        }

        .cc h3 {
            font-size: 1.05rem
        }

        .cl {
            display: block;
            margin-top: .15rem;
            font-weight: 600;
            word-break: break-word
        }

        .cc>div {
            min-width: 0
        }

        @media(max-width:480px) {
            .cl {
                font-size: .86rem
            }
        }

        .cact {
            display: flex;
            flex-wrap: wrap;
            gap: .45rem;
            margin-top: .7rem
        }

        .mini {
            display: inline-flex;
            align-items: center;
            padding: .22rem .85rem;
            border-radius: 999px;
            border: 2px solid var(--blue);
            background: var(--blue);
            color: var(--on-blue);

            gap: .6rem
        }

        .soc .sl {
            margin-right: .3rem;
            font-weight: 700

        .so {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .5rem 1.05rem;
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;

        }

        .so svg {
            width: 20px;
            height: 20px;
            transition: color .2s
        }

        .so.fb svg {
            color: #1877F2
        }

        .so.tg svg {
            color: #229ED9
        }

        .so.ig svg {
            color: #E1306C
        }

        .so:hover {
            transform: translateY(-3px);
            color: #fff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .22)
        }

        .so:hover svg {
            color: #fff
        }

        .so.fb:hover {
            background: #1877F2
        }

        .so.tg:hover {
            background: #229ED9
        }

        .so.ig:hover {
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888)
        }

        @keyframes wap {
            0% {
                box-shadow: 0 8px 22px rgba(37, 211, 102, .45), 0 0 0 0 rgba(37, 211, 102, .6)
            }

            100% {
                box-shadow: 0 8px 22px rgba(37, 211, 102, .45), 0 0 0 16px rgba(37, 211, 102, 0)
            }
        }

        .wafab {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 45;
            display: flex;
            align-items: center;
            text-decoration: none
        }

        .wafab .ico {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #25D366;
            animation: wap 2.2s infinite;
            transition: transform .2s
        }

        .wafab:hover .ico {
            transform: scale(1.08)
        }

        .wafab .ico svg {
            width: 34px;
            height: 34px
        }

        .wafab .lbl {
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
            padding: .45rem 0;
            margin-right: 0;
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink);
            font-weight: 700;
            font-size: .9rem;
            box-shadow: var(--shadow);
            transition: max-width .35s, opacity .25s, padding .35s, margin .35s
        }

        .wafab:hover .lbl,
        .wafab:focus-visible .lbl,
        .wafab.peek .lbl {
            max-width: 240px;
            opacity: 1;
            padding: .45rem 1rem;
            margin-right: .6rem
        }

        /* uni / about / contact */
        .uni {
            display: grid;
            gap: 1.5rem
        }

        .uni .lg {
            background: var(--logo-bg);
            border-radius: 20px;

        }

        @media(min-width:800px) {

                grid-template-columns: 240px 1fr;
                align-items: center
            }
        }

        ul.pl {
            padding-left: 1.2rem
        }

        .ph {
            color: var(--muted);
            font-style: italic
        }

        footer {
            background: var(--frame);
            color: var(--frame-ink);
            padding: 2rem 0 5rem;

        }

        footer .wrap {
            display: grid;
            gap: 1rem
        }

        .fl {
            display: flex;
            gap: .8rem;
            align-items: center;
            flex-wrap: wrap
        }

        .fl img {
            height: 46px;

            background: #fff;

        }

        #top {

        }

        #top.show {

        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important;

            }
        }
    </style>

                c.innerHTML = `<span class="badge ${n.level === "urgent" ? "u" : ""}">${t("cats")[n.cat]}${n.level ? " · " + t(n.level) : ""}</span>
<h3>${esc(L(n.title))}</h3><div class="meta">${fmtD(n.date)} · ${t("sampleTag")}</div><p>${esc(L(n.body))}</p>
<div class="row"><button class="btn o" type="button">${t("viewMore")}</button>${pdfBtns(n)}</div>`;
                $("button", c).onclick = () => openNotice(n); box.append(c)
            })
        }
        function openNotice(n) {
            $("#dT").textContent = L(n.title); $("#dM").textContent = `${t("cats")[n.cat]} · ${fmtD(n.date)}`; $("#dB").textContent = L(n.body);
            $("#dA").innerHTML = pdfBtns(n) + `<button class="btn o" type="button" id="dc">${t("close")}</button>`; $("#dc").onclick = () => $("#dlg").close(); $("#dlg").showModal()
        }


        /* ---- Exam timings (sample): edit the slots here ---- */
        const OUT = { en: "Dhanmondi to DSC", bn: "ধানমন্ডি থেকে DSC" }, RET = { en: "DSC to Dhanmondi", bn: "DSC থেকে ধানমন্ডি" };
        const EXSLOTS = [
            { dir: "out", label: OUT, time: "07:00" }, { dir: "out", label: OUT, time: "10:00" }, { dir: "out", label: OUT, time: "12:00" },
            { dir: "ret", label: RET, time: "10:50" }, { dir: "ret", label: RET, time: "13:30" }, { dir: "ret", label: RET, time: "16:20" }, { dir: "ret", label: RET, time: "18:10" }];
        const EXAMS = [
            { type: "mid", title: { en: "Midterm Exam", bn: "মিডটার্ম পরীক্ষা" }, slots: EXSLOTS },
            { type: "final", title: { en: "Final Exam", bn: "ফাইনাল পরীক্ষা" }, slots: EXSLOTS }];
        let exCat = "all";
        function renderExams() {
            const tabs = $("#exTabs"), box = $("#exList"); tabs.innerHTML = ""; box.innerHTML = "";
            [["all", t("exAll")], ["mid", t("exMid")], ["final", t("exFinal")]].forEach(([k, n]) => { const x = el("button", "chip", n); x.type = "button"; x.setAttribute("aria-pressed", k === exCat); x.onclick = () => { exCat = k; renderExams() }; tabs.append(x) });
            EXAMS.filter(x => exCat === "all" || x.type === exCat).forEach(x => {
                const c = el("article", "card exc" + (x.type === "final" ? " fin" : ""));
                c.innerHTML = `<div class="exh"><h3>${esc(L(x.title))}</h3><span class="tag">${t("sampleTag")}</span></div>
<ul class="exs">${x.slots.map(s => `<li class="${s.dir}"><span>${esc(L(s.label))}</span><b>${fmtT(s.time)}</b></li>`).join("")}</ul>`; box.append(c)
            })
        }

        /* ---- Gallery ---- */
        const GALLERY = [
    { src: "dhanmondi.jpeg", cat: "transport", cap: { en: "Morning bus at DSC", bn: "ডেফোডিলে সকালের বাস" } },
    { src: "transport.jpeg", cat: "transport", cap: { en: "Buses at DSC campus",     bn: "DSC ক্যাম্পাসে বাস" } },
    { src: "prize.jpeg", cat: "meetup", cap: { en: "Community Event", bn: "ট্রান্সপোর্ট কমিউনিটি ইভেন্ট" } }
]; /* add official photos: {src:"photos/a.jpg",cap:{en:"…",bn:"…"}} */
        let userPics = [], lbi = 0;
        function renderGallery() {
            const g = $("#gal"); g.innerHTML = ""; const all = [...GALLERY, ...userPics];
            if (!all.length) { for (let i = 0; i < 6; i++)g.append(el("div", "ph", t("gPh"))); g.insertAdjacentElement("beforebegin", $("#gEmpty") || Object.assign(el("p", "meta", t("gEmpty")), { id: "gEmpty" })); $("#gEmpty").textContent = t("gEmpty"); return }
            $("#gEmpty")?.remove();
            all.forEach((p, i) => {
                const b = el("button", ""); b.type = "button"; b.style.setProperty("--i", i); const cap = p.cap ? L(p.cap) : ""; b.setAttribute("aria-label", cap || "Photo " + (i + 1));
                b.innerHTML = `<img src="${p.src}" alt="${esc(cap)}" loading="lazy">${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}`; b.onclick = () => openLb(i, all); g.append(b)
            })
        }
        let lbList = [];
        function openLb(i, list) {
            if (list) lbList = list; const all = lbList; if (!all.length) return; lbi = (i + all.length) % all.length; const p = all[lbi], cap = p.cap ? L(p.cap) : "";
            $("#lbI").src = p.src; $("#lbI").alt = cap; $("#lbC").textContent = (cap ? cap + " · " : "") + nf(`${lbi + 1}/${all.length}`); if (!$("#lb").open) $("#lb").showModal()
        }
        addEventListener("keydown", e => { if (!$("#lb").open) return; if (e.key === "ArrowRight") openLb(lbi + 1); if (e.key === "ArrowLeft") openLb(lbi - 1) });

        /* ---- Gallery popup ("See more photos") ---- */
        /* Featured photos live in GALLERY (shown on the page). Put every extra photo in GALLERY_MORE.
           cat = "transport" | "meetup" | "other". The popup shows GALLERY + GALLERY_MORE together. e.g.
           { src: "photos/meetup1.jpg", cat: "meetup", cap: { en: "Community meet-up", bn: "কমিউনিটি মিটআপ" } } */
        const GALLERY_MORE = [
            { src: "dtc.png", cat: "meetup", cap: { en: "Community meet-up", bn: "কমিউনিটি মিটআপ" } },
  { src: "community.jpeg",    cat: "transport", cap: { en: "Dhanmondi Bus", bn: "ধানমন্ডি বাস" } },
  { src: "certificate.jpeg",    cat: "meetup", cap: { en: "Community meet-up", bn: "কমিউনিটি মিটআপ" } },
  { src: "advisor.jpeg",    cat: "meetup", cap: { en: "Community meet-up", bn: "কমিউনিটি মিটআপ" } },
  { src: "president.jpeg",    cat: "meetup", cap: { en: "Community meet-up", bn: "কমিউনিটি মিটআপ" } },
  { src: "ramzan.jpeg",   cat: "other" }
        ]; 
        let gmCat = "all";
        const gmAll = () => [...GALLERY, ...GALLERY_MORE], gmKey = k => "gm" + k[0].toUpperCase() + k.slice(1);
        function renderGM() {
            const all = gmAll(), tabs = $("#gmTabs"), grid = $("#gmGrid"); tabs.innerHTML = ""; grid.innerHTML = "";
            $("#gmCount").textContent = nf(String(all.length)); $("#gmOpen").style.display = all.length ? "" : "none";
            [["all", t("gmAll"), all.length], ...["transport", "meetup", "other"].map(k => [k, t(gmKey(k)), all.filter(p => (p.cat || "other") === k).length])].forEach(([k, n, c]) => {
                if (k !== "all" && !c) return;
                const x = el("button", "chip", `${esc(n)} (${nf(String(c))})`); x.type = "button"; x.setAttribute("aria-pressed", k === gmCat); x.onclick = () => { gmCat = k; renderGM() }; tabs.append(x)
            });
            const list = all.filter(p => gmCat === "all" || (p.cat || "other") === gmCat);
            if (!list.length) { grid.append(el("p", "gmempty", t("gmEmpty"))); return }
            list.forEach((p, i) => {
                const cap = p.cap ? L(p.cap) : "", b = el("button", "gi"); b.type = "button"; b.style.setProperty("--i", i); b.setAttribute("aria-label", cap || "Photo " + (i + 1));
                b.innerHTML = `<img src="${esc(p.src)}" alt="${esc(cap)}" loading="lazy"><span class="gc">${esc(t(gmKey(p.cat || "other")))}</span>${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}`;
                b.onclick = () => openLb(i, list); grid.append(b)
            })
        }
        $("#gmOpen").onclick = () => { gmCat = "all"; renderGM(); $("#gm").showModal(); document.body.style.overflow = "hidden"; $("#gmGrid").parentElement.scrollTop = 0 };
        $("#gmX").onclick = () => $("#gm").close();
        $("#gm").addEventListener("close", () => { document.body.style.overflow = "" });
        $("#gm").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close() });
        $("#lbP").onclick = () => openLb(lbi - 1); $("#lbN").onclick = () => openLb(lbi + 1); $("#lbX").onclick = () => $("#lb").close();
        $("#gFile").addEventListener("change", e => { [...e.target.files].forEach(f => userPics.push({ src: URL.createObjectURL(f), cap: { en: f.name, bn: f.name } })); e.target.value = ""; renderGallery() });

        /* ---- Complain box ---- */
        /* Connect the form: paste a Formspree/Google-Apps-Script URL below, OR an email address. */
        const COMPLAIN_ENDPOINT = "https://formsubmit.co/ajax/dtcdiu@gmail.com";   /* e.g. "https://formspree.io/f/xxxxxxx" */
        const COMPLAIN_EMAIL = "";      /* e.g. "transport@example.com" (opens the visitor's email app) */
        let cbKey = "";
        function cbShow(key, kind) { cbKey = key; const s = $("#cbStatus"); s.className = "cbst" + (kind ? " " + kind : ""); s.textContent = key ? t(key) : "" }
        function cbRefresh() { if (cbKey) $("#cbStatus").textContent = t(cbKey); $("#cbCount").textContent = nf(`${$("#cbMsg").value.length}/1000`) }
        $("#cbMsg").addEventListener("input", cbRefresh);
        $("#cbForm").addEventListener("submit", async e => {
            e.preventDefault(); const f = e.currentTarget, btn = $("#cbBtn");
            const d = Object.fromEntries(new FormData(f)); if (d.website) return; delete d.website; d.submittedAt = new Date().toISOString();
            if (COMPLAIN_ENDPOINT) {
                btn.disabled = true; cbShow("cbSending", "");
                try {
                    const r = await fetch(COMPLAIN_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(d) });
                    if (!r.ok) throw new Error(r.status); f.reset(); cbShow("cbOk", "ok")
                } catch (err) { cbShow("cbErr", "err") } finally { btn.disabled = false; cbRefresh() }
            } else if (COMPLAIN_EMAIL) {
                const body = `Student ID: ${d.studentId}\nDepartment: ${d.department}\nType: ${d.type}\n\n${d.message}`;
                location.href = `mailto:${COMPLAIN_EMAIL}?subject=${encodeURIComponent("Transport " + d.type + " - " + d.studentId)}&body=${encodeURIComponent(body)}`; cbShow("cbMail", "ok")
            } else cbShow("cbPreview", "")
        });

        /* ---- Live bus location ---- */
        /* To show REAL buses, set LIVE_ENDPOINT to a URL that returns JSON like:
           {"buses":[{"id":"b1","no":1,"route":"r1","stop":"asad","progress":0.4,"updated":"2026-11-08T09:30:00+06:00"}]}
           route    = r1 | r2 | r1r | r2r
           stop     = last stop the bus passed: d27, asad, college, shamoly, kolyanpur, tech, mazar, bera, biru, dsc
           progress = 0 to 1, how far it is toward the next stop
           Leave it empty to show a clearly labelled sample simulation. */
        const LIVE_ENDPOINT = "";
        const LIVE_TRACKER = false;   /* false = hide the route-by-route bus tracking cards; set to true when real tracking is ready */
        const LIVE_MAP_URL = "";   /* optional: link to a live map (e.g. Google Maps shared location / tracker page) */
        const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
        let live = { buses: [], at: Date.now(), ok: true }, lvRoute = "all", lvSig = "";
        const DEMO = [{ id: "b1", no: 1, route: "r1", i: 1, p: .3 }, { id: "b2", no: 2, route: "r1", i: 6, p: .6 }, { id: "b3", no: 3, route: "r2", i: 1, p: .2 }, { id: "b4", no: 4, route: "r1r", i: 3, p: .5 }, { id: "b5", no: 5, route: "r2r", i: 0, p: .1 }].map(b => ({ ...b, dw: 0 }));
        if (!LIVE_ENDPOINT) live.buses = DEMO;
        const lvName = b => b.label || `${t("liveBus")} ${nf(String(b.no))}`;
        function lvStatus(b, r) {
            const a = L(r.stops[b.i]);
            return b.i >= r.stops.length - 1 ? fill(t("liveEnd"), { s: a }) : b.p < .15 ? fill(t("liveAt"), { s: a }) : fill(t("liveBw"), { a, b: L(r.stops[b.i + 1]) })
        }
        function demoStep() {
            DEMO.forEach(b => {
                const n = ROUTES.find(r => r.id === b.route).stops.length;
                if (b.i >= n - 1) { if (++b.dw > 3) { b.i = 0; b.p = 0; b.dw = 0 } return }
                b.p += .06; if (b.p >= 1) { b.p = 0; b.i++ }
            }); live.at = Date.now(); refreshLive()
        }
        function normFeed(j) {
            return (j.buses || []).map(b => {
                const r = ROUTES.find(x => x.id === b.route); if (!r) return null;
                const i = typeof b.stop === "number" ? b.stop : r.stops.findIndex(x => x === S[b.stop]); if (i < 0) return null;
                return { id: String(b.id), no: b.no ?? b.id, label: b.label, route: b.route, i: Math.min(i, r.stops.length - 1), p: Math.max(0, Math.min(.99, +b.progress || 0)) }
            }).filter(Boolean)
        }
        async function pollLive() {
            try {
                const r = await fetch(LIVE_ENDPOINT, { cache: "no-store" }); if (!r.ok) throw new Error(r.status);
                live.buses = normFeed(await r.json()); live.at = Date.now(); live.ok = true
            } catch (e) { live.ok = false }
            refreshLive()
        }
        function renderLive() {
            const tabs = $("#lvTabs"), box = $("#lvList"); tabs.innerHTML = ""; box.innerHTML = "";
            [["all", t("allRoutes")], ...ROUTES.map(r => [r.id, L(r.name).split(":")[0]])].forEach(([k, n]) => {
                const x = el("button", "chip", esc(n)); x.type = "button"; x.setAttribute("aria-pressed", k === lvRoute); x.onclick = () => { lvRoute = k; renderLive() }; tabs.append(x)
            });
            const busSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M7 17v3M17 17v3"/><circle cx="8" cy="14" r=".7"/><circle cx="16" cy="14" r=".7"/></svg>';
            if (LIVE_TRACKER) ROUTES.filter(r => lvRoute === "all" || r.id === lvRoute).forEach(r => {
                const bs = live.buses.filter(b => b.route === r.id), c = el("article", "card lvc"); c.dataset.r = r.id;
                c.innerHTML = `<div class="lvh"><h3>${esc(L(r.name))}</h3><span class="tag">${fill(t("liveCount"), { n: nf(String(bs.length)) })}</span></div>
<div class="lvb">${bs.map(b => `<div class="bp" data-id="${esc(b.id)}"><span class="bn">${nf(String(b.no))}</span><span><strong>${esc(lvName(b))}</strong><small></small></span></div>`).join("") || `<p class="meta">${t("liveNone")}</p>`}</div>
<div class="lvt">${r.stops.map(x => `<div class="lvs"><span class="nm">${esc(L(x))}</span><span class="at"></span></div>`).join("")}${bs.map(b => `<span class="lvm" data-id="${esc(b.id)}" title="${esc(lvName(b))}">${busSvg}<i>${nf(String(b.no))}</i></span>`).join("")}</div>`;
                box.append(c)
            });
            lvSig = lvKey(); updateLive()
        }
        const lvKey = () => live.buses.map(b => b.id + b.route).join("|") + "#" + lvRoute + "#" + lang;
        function refreshLive() { lvKey() !== lvSig ? renderLive() : updateLive() }
        function updateLive() {
            const age = Math.max(0, Math.round((Date.now() - live.at) / 1000)), fresh = live.ok && age < 60;
            $("#lvPill").classList.toggle("off", !fresh); $("#lvPillT").textContent = t(fresh ? "liveOn" : "liveOff");
            $("#lvUpd").textContent = `${t("liveUpd")}: ` + (age < 5 ? t("liveJust") : age < 60 ? fill(t("liveSec"), { n: nf(String(age)) }) : fill(t("liveMin"), { n: nf(String(Math.floor(age / 60))) }));
            $("#lvSample").style.display = LIVE_ENDPOINT ? "none" : ""; $("#lvMap").style.display = LIVE_MAP_URL ? "" : "none"; $("#lvMap").href = LIVE_MAP_URL || "#";
            $$(".lvc").forEach(c => {
                const r = ROUTES.find(x => x.id === c.dataset.r), rows = $$(".lvs", c), at = rows.map(() => []);
                live.buses.filter(b => b.route === r.id).forEach(b => {
                    const m = $(`.lvm[data-id="${CSS.escape(b.id)}"]`, c); if (m) m.style.setProperty("--p", b.i + b.p);
                    const sm = $(`.bp[data-id="${CSS.escape(b.id)}"] small`, c); if (sm) sm.textContent = lvStatus(b, r);
                    if (b.p < .15 || b.i >= r.stops.length - 1) at[b.i].push(lvName(b))
                });
                rows.forEach((row, i) => { $(".at", row).innerHTML = at[i].map(n => `<span class="ab">${esc(n)}</span>`).join(""); row.classList.toggle("has", at[i].length > 0) })
            })
        }
        if (LIVE_ENDPOINT) { pollLive(); setInterval(pollLive, 10000) } else setInterval(demoStep, 2000);
        setInterval(updateLive, 1000);

        /* ---- Committee ---- */
        /* Add real members here, e.g.
           { name: { en: "Rahim Uddin", bn: "রহিম উদ্দিন" }, role: { en: "President", bn: "সভাপতি" }, photo: "photos/rahim.jpg" }
           (photo is optional). While the list is empty, six placeholder cards are shown. */
        const COMMITTEE = [
            { name: { en: "Safat Anzum", bn: "সাফাত আনজুম" }, role: { en: "Advisor", bn: "উপদেষ্টা" }, photo: "leader.jpeg" },
            { name: { en: "Bushra Jahan Bintu", bn: "বুশরা জাহান বিন্দু" }, role: { en: "President", bn: "সভাপতি" }, photo: "bushra.jpeg" },
            { name: { en: "Noman Ibna Billal", bn: "নোমান ইবনে বিল্লাল" }, role: { en: "joint secretary", bn: "যুগ্ম সচিব" }, photo: "billal.jpeg" },
            { name: { en: "Swakhar Biswas", bn: "স্বাখর বিস্বাস" }, role: { en: "Vice President", bn: "উপ-সভাপতি" }, photo: "s.jpeg" },
            { name: { en: "Halimatus Sadia Mim", bn: "হালিমাতুস সাদিয়া মিম" }, role: { en: "Executive", bn: "কর্মকর্তা" }, photo: "mim.jpeg" },
            { name: { en: "Mahmuda Talukdar", bn: "মাহমুদা তালুকদার" }, role: { en: "Executive", bn: "কর্মকর্তা" }, photo: "mahmuda.jpeg" }
        ];
        const cmIO = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); cmIO.unobserve(e.target) } }), { threshold: .15 }) : null;
        function renderCommittee() {
            const box = $("#cmList"), real = COMMITTEE.length > 0; box.innerHTML = "";
            $("#cmNote").style.display = real ? "none" : "";
            const user = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7.4 8-7.4s8 3 8 7.4z"/></svg>';
            (real ? COMMITTEE : Array.from({ length: 6 }, () => ({ name: { en: T.en.cmName, bn: T.bn.cmName }, role: { en: T.en.cmRole, bn: T.bn.cmRole } }))).forEach((m, i) => {
                const c = el("article", "card mem" + (real ? " real" : "")); c.style.setProperty("--i", i % 3);
                c.innerHTML = `<div class="mav">${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(L(m.name))}" loading="lazy">` : user}</div><h3>${esc(L(m.name))}</h3><span class="role">${esc(L(m.role))}</span>`;
                box.append(c); cmIO ? cmIO.observe(c) : c.classList.add("in")
            })
        }

        /* ---- Contact, social & WhatsApp ---- */
        const INSTAGRAM_URL = "";   /* paste the Instagram page link here to show the Instagram button in the footer */
        const WA_NUMBER = "8801934345187";
        function waRefresh() {
            const u = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t("waMsg"))}`;
            $("#wa").href = u; $("#coWa").href = u;
            const ig = $("#igLink"); if (INSTAGRAM_URL) { ig.href = INSTAGRAM_URL; ig.style.display = "" }
        }
        setTimeout(() => { const w = $("#wa"); w.classList.add("peek"); setTimeout(() => w.classList.remove("peek"), 4500) }, 2500);

        /* ---- Language & theme ---- */
        function applyLang() {
            document.documentElement.lang = lang;
            $$("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
            $$("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
            $("#lang").textContent = lang === "en" ? "বাং" : "EN"; $("#lang").setAttribute("aria-label", lang === "en" ? "বাংলায় দেখুন" : "Switch to English");
            fillSelects(); renderSchedule(); renderRoutes(); renderCats(); renderNotices(); renderExams(); renderGallery(); renderGM(); cbRefresh(); renderLive(); renderCommittee(); waRefresh(); tick()
        }
        function applyTheme() { document.documentElement.dataset.theme = theme; $("#theme").textContent = theme === "dark" ? "☀️" : "🌙" }
        $("#lang").onclick = () => { lang = lang === "en" ? "bn" : "en"; save("dtc-lang", lang); applyLang() };
        $("#theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; save("dtc-theme", theme); applyTheme() };
        ["#q", "#fRoute", "#fDay"].forEach(s => $(s).addEventListener("input", renderSchedule));
        $("#nq").addEventListener("input", renderNotices);
        $("#viewAll").onclick = () => { showAll = true; renderNotices() };

        /* ---- Nav ---- */
        const menu = $("#menu"), links = $("#links");
        menu.onclick = () => { const o = links.classList.toggle("open"); menu.setAttribute("aria-expanded", o) };
        $$("#links a").forEach(a => a.addEventListener("click", () => { links.classList.remove("open"); menu.setAttribute("aria-expanded", false) }));
        $("#top").onclick = () => scrollTo({ top: 0 });
        const secs = ["home", "schedule", "exams", "routes", "live", "notices", "gallery", "about", "committee", "complain", "contact"].map(id => $("#" + id));
        addEventListener("scroll", () => {
            $("#top").classList.toggle("show", scrollY > 500);
            let cur = "home"; secs.forEach(s => { if (s.getBoundingClientRect().top < 120) cur = s.id });
            $$("#links a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur))
        }, { passive: true });

        /* logo fallback: hide broken images gracefully */
        $$("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden" }));
        applyTheme(); applyLang(); setInterval(tick, 1000);
    </script>
</body>
